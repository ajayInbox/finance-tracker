<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinFlow — Sign Up</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body>
  <main class="phone-page">
    <section class="auth-card">
      <header class="brand-header">
        <div class="brand-mark" aria-hidden="true"><span>F</span></div>
        <div class="brand-name">FinFlow</div>
      </header>

      <div class="hero-art signup-art" aria-hidden="true">
        <div class="art-orbit"></div>
        <div class="person-bubble">
          <div class="person-head"></div>
          <div class="person-body"></div>
        </div>
        <span class="star star-1">✦</span>
        <span class="star star-2">✧</span>
        <div class="sprig"><span></span><span></span><span></span></div>
      </div>

      <div class="auth-heading">
        <h1>Create your account</h1>
        <p>Start your journey to financial clarity</p>
      </div>

      <form class="auth-form">
        <label class="input-field">
          <span class="field-icon user-icon" aria-hidden="true"></span>
          <input type="text" placeholder="Full Name" autocomplete="name" />
        </label>

        <label class="input-field">
          <span class="field-icon email-icon" aria-hidden="true"></span>
          <input type="email" placeholder="Email" autocomplete="email" />
        </label>

        <label class="input-field">
          <span class="field-icon lock-icon" aria-hidden="true"></span>
          <input type="password" placeholder="Create Password" autocomplete="new-password" />
          <button class="visibility-btn" type="button" aria-label="Show password">
            <span class="eye-icon" aria-hidden="true"></span>
          </button>
        </label>

        <label class="input-field">
          <span class="field-icon lock-icon" aria-hidden="true"></span>
          <input type="password" placeholder="Confirm Password" autocomplete="new-password" />
          <button class="visibility-btn" type="button" aria-label="Show password">
            <span class="eye-icon" aria-hidden="true"></span>
          </button>
        </label>

        <label class="terms-row">
          <input type="checkbox" checked />
          <span class="custom-check" aria-hidden="true"></span>
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>

        <button class="primary-btn" type="submit">Sign Up</button>
      </form>

      <div class="divider"><span></span><em>or</em><span></span></div>

      <button class="social-btn google-btn" type="button">
        <span class="google-g">G</span>
        <span>Sign up with Google</span>
      </button>

      <p class="switch-text">Already have an account? <a href="signin.html">Sign In</a></p>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>

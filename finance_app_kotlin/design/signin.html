<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinFlow — Sign In</title>
  <link rel="stylesheet" href="signin.css" />
</head>
<body>
  <main class="phone-page">
    <section class="auth-card">
      <header class="brand-header">
        <div class="brand-mark" aria-hidden="true"><span>F</span></div>
        <div class="brand-name">FinFlow</div>
      </header>

      <div class="hero-art signin-art" aria-hidden="true">
        <div class="art-glow"></div>
        <div class="wallet">
          <div class="wallet-card"></div>
          <div class="wallet-body"></div>
          <div class="wallet-button"></div>
        </div>
        <span class="spark spark-1"></span>
        <span class="spark spark-2"></span>
        <span class="spark spark-3"></span>
      </div>

      <div class="auth-heading">
        <h1>Welcome back!</h1>
        <p>Sign in to continue to your FinFlow account</p>
      </div>

      <form class="auth-form">
        <label class="input-field">
          <span class="field-icon email-icon" aria-hidden="true"></span>
          <input type="text" placeholder="Email or Phone number" autocomplete="username" />
        </label>

        <label class="input-field">
          <span class="field-icon lock-icon" aria-hidden="true"></span>
          <input type="password" placeholder="Password" autocomplete="current-password" />
          <button class="visibility-btn" type="button" aria-label="Show password">
            <span class="eye-icon" aria-hidden="true"></span>
          </button>
        </label>

        <div class="form-row-right">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button class="primary-btn" type="submit">Sign In</button>
      </form>

      <div class="divider"><span></span><em>or</em><span></span></div>

      <button class="social-btn google-btn" type="button">
        <span class="google-g">G</span>
        <span>Continue with Google</span>
      </button>

      <p class="switch-text">Don’t have an account? <a href="signup.html">Sign Up</a></p>

      <div class="bottom-art" aria-hidden="true">
        <div class="hill hill-a"></div>
        <div class="hill hill-b"></div>
        <div class="plant">
          <div class="stem"></div>
          <span class="leaf leaf-1"></span>
          <span class="leaf leaf-2"></span>
          <span class="leaf leaf-3"></span>
          <span class="leaf leaf-4"></span>
        </div>
        <div class="growth-chart">
          <div class="chart-line"></div>
          <div class="bar bar-1"></div>
          <div class="bar bar-2"></div>
          <div class="bar bar-3"></div>
          <div class="bar bar-4"></div>
        </div>
      </div>

      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>

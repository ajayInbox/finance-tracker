name: Test Mobile Build

on:
  push:
    branches:
      - main
    paths:
      - 'finance_app/**'
  workflow_dispatch:

jobs:
  compile-test-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        working-directory: ./finance_app
        run: flutter pub get

      - name: Build Debug APK
        working-directory: ./finance_app
        env:
          # 🎯 Allocation boost explicitly prevents the "Java heap space" crash
          GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=512m -Dorg.gradle.jvmargs=-Xmx3072m"
        run: flutter build apk --debug

      - name: Upload APK to GitHub Actions Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-debug
          path: finance_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
